name: Lighthouse PR Report

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      trigger_id:
        description: 'Backstage trigger id for run tracking'
        required: false
        type: string
      trigger_source:
        description: 'Trigger source'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          VITE_BASE_URL: https://idtech-clone-api.onrender.com
        run: npm run build

      - name: Run Lighthouse CI
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/idtech-clone/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Vite preview did not start in time."
            cat /tmp/vite-preview.log || true
            exit 1
          fi

          npx @lhci/cli@0.15.x collect --url=http://127.0.0.1:4173/idtech-clone/ --numberOfRuns=3 --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage"
          npx @lhci/cli@0.15.x upload --target=temporary-public-storage

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci

      - name: Format Lighthouse summary
        id: summary
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const reportDir = path.resolve('.lighthouseci')
          if (!fs.existsSync(reportDir)) {
            throw new Error('Missing .lighthouseci report directory.')
          }

          const manifestPath = path.join(reportDir, 'manifest.json')
          let reportPath = null
          if (fs.existsSync(manifestPath)) {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
            const latest = Array.isArray(manifest) ? manifest[manifest.length - 1] : null
            if (latest?.jsonPath) {
              reportPath = path.resolve(reportDir, latest.jsonPath)
            }
          }

          if (!reportPath || !fs.existsSync(reportPath)) {
            const reportFiles = fs
              .readdirSync(reportDir)
              .filter((name) => name.startsWith('lhr-') && name.endsWith('.json'))
              .sort()
            if (reportFiles.length === 0) {
              throw new Error('No Lighthouse report json file found.')
            }
            reportPath = path.join(reportDir, reportFiles[reportFiles.length - 1])
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const audits = report.audits || {}
          const categories = report.categories || {}

          const performanceScore = Number(categories?.performance?.score ?? 0) * 100
          const lcpMs = Number(audits?.['largest-contentful-paint']?.numericValue ?? NaN)
          const cls = Number(audits?.['cumulative-layout-shift']?.numericValue ?? NaN)
          const fidLikeMs = Number(audits?.['max-potential-fid']?.numericValue ?? NaN)
          const inpMs = Number(audits?.['interaction-to-next-paint']?.numericValue ?? NaN)
          const tbtMs = Number(audits?.['total-blocking-time']?.numericValue ?? NaN)
          const fcpMs = Number(audits?.['first-contentful-paint']?.numericValue ?? NaN)
          const speedIndexMs = Number(audits?.['speed-index']?.numericValue ?? NaN)
          const accessibilityScore = Number(categories?.accessibility?.score ?? NaN) * 100
          const bestPracticesScore = Number(categories?.['best-practices']?.score ?? NaN) * 100
          const seoScore = Number(categories?.seo?.score ?? NaN) * 100

          const toFixed = (value, digits = 2) => (Number.isFinite(value) ? value.toFixed(digits) : '--')

          const body = [
            '<!-- lighthouse-pr-report -->',
            '## Lighthouse CI Report',
            '',
            '| Metric | Value |',
            '| --- | ---: |',
            `| Performance Score | ${toFixed(performanceScore, 1)} |`,
            `| LCP (ms) | ${toFixed(lcpMs, 0)} |`,
            `| CLS | ${toFixed(cls, 3)} |`,
            `| FID-like (Max Potential FID, ms) | ${toFixed(fidLikeMs, 0)} |`,
            '',
            '_Note: Lighthouse does not provide real-user FID; Max Potential FID is a lab approximation._',
          ].join('\n')

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `performance_score=${toFixed(performanceScore, 1)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `lcp_ms=${toFixed(lcpMs, 0)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `cls=${toFixed(cls, 3)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `fid_like_ms=${toFixed(fidLikeMs, 0)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `inp_ms=${toFixed(inpMs, 0)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tbt_ms=${toFixed(tbtMs, 0)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `fcp_ms=${toFixed(fcpMs, 0)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `speed_index_ms=${toFixed(speedIndexMs, 0)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `accessibility_score=${toFixed(accessibilityScore, 1)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `best_practices_score=${toFixed(bestPracticesScore, 1)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `seo_score=${toFixed(seoScore, 1)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `comment_body<<EOF\n${body}\nEOF\n`)
          NODE

      - name: Push Lighthouse metrics to backend
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL || vars.BACKEND_BASE_URL }}
          LIGHTHOUSE_METRICS_INGEST_TOKEN: ${{ secrets.LIGHTHOUSE_METRICS_INGEST_TOKEN || vars.LIGHTHOUSE_METRICS_INGEST_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PERFORMANCE_SCORE: ${{ steps.summary.outputs.performance_score }}
          ACCESSIBILITY_SCORE: ${{ steps.summary.outputs.accessibility_score }}
          BEST_PRACTICES_SCORE: ${{ steps.summary.outputs.best_practices_score }}
          SEO_SCORE: ${{ steps.summary.outputs.seo_score }}
          LCP_MS: ${{ steps.summary.outputs.lcp_ms }}
          CLS: ${{ steps.summary.outputs.cls }}
          FID_LIKE_MS: ${{ steps.summary.outputs.fid_like_ms }}
          INP_MS: ${{ steps.summary.outputs.inp_ms }}
          TBT_MS: ${{ steps.summary.outputs.tbt_ms }}
          FCP_MS: ${{ steps.summary.outputs.fcp_ms }}
          SPEED_INDEX_MS: ${{ steps.summary.outputs.speed_index_ms }}
        run: |
          if [ -z "${BACKEND_BASE_URL}" ] || [ -z "${LIGHTHOUSE_METRICS_INGEST_TOKEN}" ]; then
            echo "Skip ingest: BACKEND_BASE_URL or LIGHTHOUSE_METRICS_INGEST_TOKEN is missing."
            exit 0
          fi

          payload=$(node -e "const parseNumber=(value)=>{const normalized=String(value??'').trim();if(!normalized||normalized==='--')return null;const parsed=Number(normalized);return Number.isFinite(parsed)?parsed:null;};const parseInteger=(value)=>{const normalized=String(value??'').trim();if(!normalized)return null;const parsed=Number.parseInt(normalized,10);return Number.isFinite(parsed)?parsed:null;};const payload={source:'github-actions',repository:process.env.GITHUB_REPOSITORY,pullRequestNumber:parseInteger(process.env.PR_NUMBER),branch:process.env.GITHUB_HEAD_REF||process.env.GITHUB_REF_NAME,commitSha:process.env.GITHUB_SHA,targetUrl:'https://chang-hsi.github.io/idtech-clone/',performanceScore:parseNumber(process.env.PERFORMANCE_SCORE),accessibilityScore:parseNumber(process.env.ACCESSIBILITY_SCORE),bestPracticesScore:parseNumber(process.env.BEST_PRACTICES_SCORE),seoScore:parseNumber(process.env.SEO_SCORE),lcpMs:parseNumber(process.env.LCP_MS),cls:parseNumber(process.env.CLS),fidLikeMs:parseNumber(process.env.FID_LIKE_MS),inpMs:parseNumber(process.env.INP_MS),tbtMs:parseNumber(process.env.TBT_MS),fcpMs:parseNumber(process.env.FCP_MS),speedIndexMs:parseNumber(process.env.SPEED_INDEX_MS),runId:process.env.GITHUB_RUN_ID,runUrl:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,recordedAt:new Date().toISOString(),rawPayload:{workflow:process.env.GITHUB_WORKFLOW,job:process.env.GITHUB_JOB,attempt:process.env.GITHUB_RUN_ATTEMPT}};process.stdout.write(JSON.stringify(payload));")

          http_code=$(curl --silent --show-error \
            -o /tmp/lighthouse-ingest-response.json \
            -w "%{http_code}" \
            -X POST "${BACKEND_BASE_URL}/api/internal/seo/lighthouse-records" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LIGHTHOUSE_METRICS_INGEST_TOKEN}" \
            -d "${payload}")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Lighthouse ingest failed with HTTP ${http_code}"
            cat /tmp/lighthouse-ingest-response.json
            exit 1
          fi

      - name: Upsert PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ steps.summary.outputs.comment_body }}
        with:
          script: |
            const marker = '<!-- lighthouse-pr-report -->'
            const body = process.env.COMMENT_BODY
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }

      - name: Resolve failed step
        if: always()
        id: failed_step
        uses: actions/github-script@v7
        with:
          script: |
            let failedStep = ''
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              })
              for (const job of jobs) {
                for (const step of job.steps || []) {
                  if (step.conclusion === 'failure') {
                    failedStep = `${job.name} / ${step.name}`
                    break
                  }
                }
                if (failedStep) break
              }
            } catch (error) {
              failedStep = `Unable to resolve failed step: ${error.message}`
            }
            core.setOutput('value', failedStep)

      - name: Report run status to backend
        if: always()
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL || vars.BACKEND_BASE_URL }}
          LIGHTHOUSE_METRICS_INGEST_TOKEN: ${{ secrets.LIGHTHOUSE_METRICS_INGEST_TOKEN || vars.LIGHTHOUSE_METRICS_INGEST_TOKEN }}
          TRIGGER_ID: ${{ github.event.inputs.trigger_id }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
          FAILED_STEP: ${{ steps.failed_step.outputs.value }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          if [ -z "${BACKEND_BASE_URL}" ] || [ -z "${LIGHTHOUSE_METRICS_INGEST_TOKEN}" ]; then
            echo "Skip run report: BACKEND_BASE_URL or LIGHTHOUSE_METRICS_INGEST_TOKEN is missing."
            exit 0
          fi

          payload=$(node -e "const workflowStatus=String(process.env.WORKFLOW_STATUS||'').trim();const status=workflowStatus==='success'?'success':workflowStatus==='cancelled'?'cancelled':'failed';const conclusion=status==='success'?'success':status==='cancelled'?'cancelled':'failure';const payload={triggerId:process.env.TRIGGER_ID?String(process.env.TRIGGER_ID):null,repository:process.env.GITHUB_REPOSITORY,workflowId:'lighthouse-pr.yml',ref:process.env.GITHUB_HEAD_REF||process.env.GITHUB_REF_NAME,runId:String(process.env.GITHUB_RUN_ID),runUrl:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,status,conclusion,failureStep:process.env.FAILED_STEP?String(process.env.FAILED_STEP):null,failureReason:status==='success'?null:status==='cancelled'?'Workflow was cancelled.':'Workflow failed. Check run logs for details.',completedAt:new Date().toISOString(),rawPayload:{eventName:process.env.GITHUB_EVENT_NAME,triggerSource:process.env.TRIGGER_SOURCE||'',workflow:process.env.GITHUB_WORKFLOW,job:process.env.GITHUB_JOB,attempt:process.env.GITHUB_RUN_ATTEMPT}};process.stdout.write(JSON.stringify(payload));")

          http_code=$(curl --silent --show-error \
            -o /tmp/lighthouse-run-report-response.json \
            -w "%{http_code}" \
            -X POST "${BACKEND_BASE_URL}/api/internal/seo/lighthouse-runs/report" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LIGHTHOUSE_METRICS_INGEST_TOKEN}" \
            -d "${payload}")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Lighthouse run report failed with HTTP ${http_code}"
            cat /tmp/lighthouse-run-report-response.json
            exit 1
          fi
